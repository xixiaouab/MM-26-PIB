[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompted-information-bottlenecks"
version = "0.1.0"
description = "Prompted Information Bottlenecks for frozen vision transformers"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch>=2.6,<2.7", "torchvision>=0.21,<0.22", "timm==1.0.30", "Pillow>=10", "numpy>=1.24", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pib-prepare = "pib.prepare:main"
pib-train = "pib.train:main"
pib-evaluate = "pib.evaluate:main"
pib-predict = "pib.predict:main"
pib-diagnose = "pib.diagnose:main"

[tool.setuptools.packages.find]
include = ["pib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
