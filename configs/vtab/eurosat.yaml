model:
  backbone: vit_base_patch16_224.orig_in21k
  pretrained: true
  prompt_length: 10
  prompt_layers: all
  prompt_std: 0.02
  prompt_dropout: 0.0
  features: cls_gap
  num_classes: 10
data:
  root: data/vtab-1k
  manifest: data/vtab_manifests/eurosat_1000.csv
  protocol: official
  image_size: 224
  resize_size: 224
  augment: rrc
  resize_mode: square
  mean:
  - 0.5
  - 0.5
  - 0.5
  std:
  - 0.5
  - 0.5
  - 0.5
  num_workers: 6
  persistent_workers: true
  cache_in_memory: true
  verify_files: false
  eval_batch_size: 256
  crop_scale:
  - 0.5
  - 1.0
training:
  seed: 0
  epochs: 100
  batch_size: 64
  balanced_batches: true
  samples_per_class: 2
  learning_rate: 0.01
  weight_decay: 0.0001
  warmup_epochs: 10
  regularization_warmup: 10
  precision: bf16
  gradient_clip: null
loss:
  compression:
    end: 0.01
    start: 0.001
  sufficiency:
    end: 0.001
    start: 0.01
  alpha: 1.0
  delta: 0.05
  path_weight: 0.01
  routing: true
  normalization: mean
  eps: 1.0e-08
