# FGVC and HTA with a frozen supervised ViT-B/16 (ImageNet-21k), following the VPT / DAM-VP data
# protocol: resize the shorter side to 256, random 224 crop and horizontal flip for training, center
# crop for evaluation. The manifest, prompt length, optimizer settings, seed, and loss weights are set per run.
model:
  backbone: vit_base_patch16_224.orig_in21k
  pretrained: true
  prompt_length: 10
  prompt_layers: all
  prompt_std: 0.02
  prompt_dropout: 0.0
data:
  root: /lustre/orion/csc662/proj-shared/xxiao/PIB/data/images
  manifest: null
  protocol: official
  image_size: 224
  resize_size: 256
  augment: crop
  resize_mode: shorter
  horizontal_flip: 0.5
  mean: [0.5, 0.5, 0.5]
  std: [0.5, 0.5, 0.5]
  num_workers: 6
  persistent_workers: true
  cache_in_memory: false
  verify_files: false
  eval_batch_size: 256
training:
  seed: 0
  epochs: 100
  batch_size: 64
  balanced_batches: true
  samples_per_class: 2
  learning_rate: 0.001
  weight_decay: 0.0001
  warmup_epochs: 10
  regularization_warmup: 10
  precision: bf16
  gradient_clip: null
loss:
  compression: {start: 0.01, end: 0.1}
  sufficiency: {start: 0.1, end: 0.01}
  alpha: 1.0
  delta: 0.05
  path_weight: 0.1
  routing: true
  normalization: mean
  eps: 0.00000001
