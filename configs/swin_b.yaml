model:
  backbone: swin_base_patch4_window7_224.ms_in22k
  pretrained: true
  prompt_length: 20
  prompt_layers: all
  prompt_std: 0.02
  prompt_dropout: 0.0
data:
  root: data/images
  manifest: data/splits.csv
  protocol: official
  split_seed: 42
  image_size: 224
  resize_size: 256
  crop_scale: [0.08, 1.0]
  horizontal_flip: 0.5
  num_workers: 4
training:
  seed: 0
  epochs: 100
  batch_size: 64
  balanced_batches: true
  samples_per_class: 2
  learning_rate: 0.001
  weight_decay: 0.0001
  warmup_epochs: 10
  regularization_warmup: 10
  precision: fp32
  gradient_clip: null
loss:
  compression: {start: 0.01, end: 0.1}
  sufficiency: {start: 0.1, end: 0.01}
  alpha: 1.0
  delta: 0.05
  path_weight: 0.1
  routing: true
  normalization: mean
  eps: 0.00000001
